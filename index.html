.slot span{position:absolute;right:2px;bottom:0;font-size:12px;font-weight:700;text-shadow:0 0 3px #000}

async function exportPack(p){const files={};const enc=new TextEncoder();
 if(p.files&&Object.keys(p.files).length){Object.assign(files,p.files);if(!files['manifest.json'])files['manifest.json']=enc.encode(JSON.stringify(mfFor(p)))}
 else{files['manifest.json']=enc.encode(JSON.stringify(mfFor(p)));
  for(const i in p.tiles){const r=await fetch(p.tiles[i]);files['textures/blocks/'+(AL[i]?AL[i][0]:'tile_'+i)+'.png']=new Uint8Array(await r.arrayBuffer())}
  for(const n in p.tex||{}){const r=await fetch(p.tex[n]);files['textures/blocks/'+n+'.png']=new Uint8Array(await r.arrayBuffer())}
  for(const b of p.blocks||[])files['blocks/'+b.id.split(':').pop()+'.json']=enc.encode(JSON.stringify({format_version:'1.20.10','minecraft:block':{description:{identifier:b.id},components:{'minecraft:light_emission':b.emit?15:0,'minecraft:map_color':b.color,'minecraft:destructible_by_mining':{seconds_to_destroy:b.hard!=null?b.hard:1.5}}}}))}
 await saveFile(p.name.replace(/\W+/g,'_')+(p.kind==='resource'?'.mcpack':'.mcaddon'),makeZip(files))}
const mfFor=p=>({format_version:2,header:{name:p.name,description:p.desc||'Made with BlockForge',uuid:/^[0-9a-f-]{36}$/.test(p.id)?p.id:crypto.randomUUID(),version:[1,0,0],min_engine_version:[1,20,0]},modules:[{type:p.kind==='resource'?'resources':'data',uuid:crypto.randomUUID(),version:[1,0,0]}]});
/* ---------- built-in library ---------- */
const LIB=[{id:'lib.neon',kind:'behavior',name:'Neon Blocks',desc:'Three glowing blocks for night builds.',blocks:[{id:'bf:neon_pink',name:'Neon Pink',color:'#ff2d95',emit:true},{id:'bf:neon_cyan',name:'Neon Cyan',color:'#18e6ff',emit:true},{id:'bf:neon_lime',name:'Neon Lime',color:'#9dff2e',emit:true}]},
 {id:'lib.build',kind:'behavior',name:'Builder Set',desc:'Red brick, marble, slate and hay blocks.',blocks:[{id:'bf:red_brick',name:'Red Brick',color:'#a8432f'},{id:'bf:marble',name:'Marble',color:'#e8e6e1'},{id:'bf:slate',name:'Slate',color:'#4a5560'},{id:'bf:hay',name:'Hay Bale',color:'#d6b73c'}]},
 {id:'lib.pastel',kind:'resource',name:'Pastel Textures',desc:'Soft, light colour palette for every block.',mul:[1.1,1.0,1.2]},{id:'lib.sharp',kind:'resource',name:'High Contrast Textures',desc:'Deeper colours that stay readable on small screens.',mul:[.85,.95,.85]}];
async function installLib(l){const p={id:l.id,name:l.name,kind:l.kind,desc:l.desc,active:false,order:packs.length,tiles:{},tex:{},blocks:l.blocks||[],files:{}};
 if(l.mul)for(let i=0;i<23;i++){const c=procTile(i,l.mul);p.tiles[i]=c.toDataURL()}
 const ex=packs.findIndex(q=>q.id===p.id);if(ex>=0)packs.splice(ex,1);packs.push(p);await dbPut('packs',p)}
/* ---------- actions & menu ---------- */
const A={resume(){paused=false;$('#menu').style.display='none';$('#inv').style.display='none';$('#hot').style.display='flex';$('#info').style.display='block';$('#touch').style.display=touchMode?'block':'none';last=performance.now()},
 menuOpen(){paused=true;if(document.exitPointerLock)document.exitPointerLock();A.save();menu()},
 async save(){if(!G||G.temp)return;const w=G.w;w.player=G.p;w.time=G.t;w.modified=Date.now();await dbPut('worlds',w)},
 async quit(){await A.save();G=null;paused=true;$('#hot').style.display=$('#stats').style.display=$('#touch').style.display='none';$('#info').style.display='none';menu('play')},
 async play(id){const w=(await dbAll('worlds')).find(x=>x.id===id);if(w)startWorld(w)},
 async create(){const w=newWorld({name:$('#nn').value||'World',seed:strSeed($('#ns').value||Math.random()*2e9|0),mode:$('#nm').value,diff:+$('#nd').value,amp:+$('#na').value,guestBuild:$('#ng').checked});await dbPut('worlds',w);startWorld(w)},
 async rename(id){const w=(await dbAll('worlds')).find(x=>x.id===id),n=prompt('New name',w.name);if(n){w.name=n;await dbPut('worlds',w);menu()}},
 async dup(id){const w=(await dbAll('worlds')).find(x=>x.id===id),c=structuredClone(w);c.id=uid();c.name=w.name+' copy';c.modified=Date.now();await dbPut('worlds',c);menu()},
 async del(id){if(confirm('Delete this world and its backups permanently?')){await dbDel('worlds',id);for(const b of await dbAll('backups'))if(b.wid===id)await dbDel('backups',b.id);menu()}},
 async backup(id){const w=(G&&G.w.id===id?G.w:(await dbAll('worlds')).find(x=>x.id===id));await A.save();await dbPut('backups',{id:uid(),wid:id,time:Date.now(),data:structuredClone(w)});toast('Backup saved');menu()},
 async restore(bid){const b=(await dbAll('backups')).find(x=>x.id===bid);if(b&&confirm('Replace the current world with this backup?')){if(G&&G.w.id===b.wid)G=null;const w=structuredClone(b.data);w.modified=Date.now();await dbPut('worlds',w);menu()}},
 async delBackup(bid){await dbDel('backups',bid);menu()},
 async exp(id){const w=(G&&G.w.id===id?(await A.save(),G.w):(await dbAll('worlds')).find(x=>x.id===id)),e=new TextEncoder();await saveFile(w.name.replace(/\W+/g,'_')+'.mcworld',makeZip({'blockforge_world.json':e.encode(JSON.stringify(w)),'levelname.txt':e.encode(w.name),'world_icon.txt':e.encode('BlockForge')}))},
 async imp(files){const out=[];for(const f of files){try{await importArchive(f,out)}catch(e){out.push('✖ '+f.name+': '+e.message)}}alert(out.join('\n')||'Nothing importable found');menu()},
 async togglePack(id){const p=packs.find(x=>x.id===id);p.active=!p.active;await dbPut('packs',p);await applyPacks();menu()},
 async movePack(id,d){const l=packs.filter(x=>x.kind===packs.find(y=>y.id===id).kind).sort((a,b)=>a.order-b.order),i=l.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=l.length)return;[l[i].order,l[j].order]=[l[j].order,l[i].order];await dbPut('packs',l[i]);await dbPut('packs',l[j]);await applyPacks();menu()},
 async delPack(id){if(!confirm('Remove this pack?'))return;packs=packs.filter(x=>x.id!==id);await dbDel('packs',id);await applyPacks();menu()},
 async renamePack(id){const p=packs.find(x=>x.id===id),n=prompt('Pack name',p.name);if(n){p.name=n;await dbPut('packs',p);menu()}},
 async newPack(kind){const n=prompt('Name for the new '+kind+' pack','My '+kind+' pack');if(!n)return;const p={id:uid(),name:n,kind,active:false,order:packs.length,desc:'',tiles:{},tex:{},blocks:[],files:{}};packs.push(p);await dbPut('packs',p);menu()},
 async addBlock(id){const p=packs.find(x=>x.id===id),n=prompt('Block name');if(!n)return;const c=prompt('Colour (hex, e.g. #3366ff)','#3366ff');if(!/^#[0-9a-f]{6}$/i.test(c||''))return alert('Use a 6-digit hex colour like #3366ff');p.blocks.push({id:'custom:'+n.toLowerCase().replace(/\W+/g,'_'),name:n,color:c,emit:confirm('Should it glow (emit light)?')});p.files={};await dbPut('packs',p);await applyPacks();menu()},
 async tileUpload(id,i,f){const p=packs.find(x=>x.id===id);if(!f)return;const r=new FileReader();r.onload=async()=>{p.tiles[i]=r.result;p.files={};await dbPut('packs',p);if(p.active)await applyPacks();menu()};r.readAsDataURL(f)},
 async editPack(id){const p=packs.find(x=>x.id===id);$('#mbody').innerHTML=`<div class=card><h3>${esc(p.name)} — tiles</h3><small>Upload a PNG for any block face. Square images work best.</small><br>`+Object.entries({0:'Grass top',1:'Grass side',2:'Dirt',3:'Stone',4:'Sand',5:'Water',6:'Log top',7:'Log side',8:'Leaves',9:'Planks',10:'Cobblestone',11:'Snow',12:'Glass',13:'Coal ore',14:'Table top',15:'Table side',16:'Farmland',17:'Wheat',18:'Lamp',19:'Bedrock'}).map(([i,n])=>`<label class=btn>${n}${p.tiles[i]?' ✓':''}<input type=file hidden accept="image/png" onchange="A.tileUpload('${id}',${i},this.files[0])"></label>`).join('')+`<br><button onclick="menu('packs')">Done</button></div>`},
 async installLib(id){await installLib(LIB.find(l=>l.id===id));toast('Installed. Activate it in Packs.');menu()},
 inv(){const el=$('#inv');if(el.style.display==='block'){el.style.display='none';return}const m=mode()==='creative',ids=m?[...Object.keys(BL).map(Number).filter(i=>i!=5&&i!=17),...Object.keys(IT).map(Number)]:Object.keys(G.w.inv).map(Number);
  el.innerHTML=`<b>${m?'Creative inventory':'Inventory'}</b> <small>tap an item to put it in the selected hotbar slot</small> <button style="float:right" onclick="A.inv()">✕</button><div>`+ids.map(i=>`<div class=slot title="${esc(nameOf(i))}" style="background-image:${icon(i)}" onclick="A.pick(${i})">${m?'':`<span>${G.w.inv[i]}</span>`}</div>`).join('')+`</div><hr><b>Crafting</b><div>`+
  RECIPES.map((r,k)=>{const ok=m||r.i.every(([id,n])=>(G.w.inv[id]||0)>=n);return`<button ${ok?'':'style="opacity:.45"'} onclick="A.craft(${k})">${r.n}: ${r.i.map(([id,n])=>n+'× '+nameOf(id)).join(' + ')} → ${r.o[1]}× ${nameOf(r.o[0])}</button>`}).join('')+`</div>`;el.style.display='block'},
 pick(i){G.w.hot[G.sel]=i;if(mode()==='creative'&&!BL[i]&&!IT[i])return;rebuildHot()},
 craft(k){const r=RECIPES[k];if(mode()!=='creative'){if(!r.i.every(([id,n])=>(G.w.inv[id]||0)>=n))return toast('Missing ingredients');r.i.forEach(([id,n])=>invTake(id,n))}invAdd(r.o[0],r.o[1]);rebuildHot();A.inv();A.inv()},
 async hostCode(){try{$('#hc').value=await NET.host()}catch(e){alert(e.message)}},async accept(){try{await NET.accept($('#ac').value);toast('Linking… the guest should connect now')}catch(e){alert('Invalid code')}},
 async joinCode(){try{$('#jc2').value=await NET.join($('#jc').value)}catch(e){alert('Invalid code: '+e.message)}},
 set(k,v){S[k]=+v;saveS()}};
let tab='play';const V={};
async function menu(t){if(t)tab=t;$('#menu').style.display='flex';paused=true;$('#hot').style.display='none';
 $('#tabs').innerHTML=['play','packs','library','multi','settings'].map(x=>`<b class="${x==tab?'on':''}" onclick="menu('${x}')">${{play:'Worlds',packs:'Packs',library:'Library',multi:'Multiplayer',settings:'Settings'}[x]}</b>`).join('')+(G?'<b onclick="A.resume()">Back to game</b>':'');
 $('#mbody').innerHTML=await V[tab]()}
V.play=async()=>{const ws=(await dbAll('worlds')).sort((a,b)=>b.modified-a.modified),bk=await dbAll('backups');
 return(G?`<div class=card><b>${esc(G.w.name)}</b> is running <button onclick="A.resume()">Resume</button><button onclick="A.save().then(()=>toast('Saved'))">Save</button><button onclick="A.quit()">Quit to menu</button></div>`:'')+
 `<div class=card><h3>New world</h3><input id=nn value="My World"><input id=ns placeholder="Seed (blank = random)"><br><select id=nm><option value=creative>Creative<option value=survival>Survival<option value=adventure>Adventure</select><select id=nd><option value=0>Peaceful<option value=1>Easy<option value=2 selected>Normal<option value=3>Hard</select><br><label>Terrain height <input id=na type=range min=.5 max=2 step=.1 value=1></label><br><label><input id=ng type=checkbox checked> Guests can build</label><br><button onclick="A.create()">Create &amp; play</button><label class=btn>Import world / pack<input type=file hidden multiple accept=".mcworld,.mcpack,.mcaddon,.zip" onchange="A.imp(this.files)"></label></div>`+
 ws.map(w=>`<div class=card><b>${esc(w.name)}</b> <small>${w.mode}, difficulty ${w.diff}, seed ${w.seed}, ${new Date(w.modified).toLocaleString()}</small><br><button onclick="A.play('${w.id}')">Play</button><button onclick="A.rename('${w.id}')">Rename</button><button onclick="A.dup('${w.id}')">Duplicate</button><button onclick="A.backup('${w.id}')">Backup</button><button onclick="A.exp('${w.id}')">Export</button><button onclick="A.del('${w.id}')">Delete</button>${bk.filter(b=>b.wid===w.id).sort((a,b)=>b.time-a.time).map(b=>`<div><small>Backup ${new Date(b.time).toLocaleString()}</small> <button onclick="A.restore('${b.id}')">Restore</button><button onclick="A.delBackup('${b.id}')">✕</button></div>`).join('')}</div>`).join('')||'<small>No worlds yet.</small>'}
V.packs=async()=>{const row=p=>`<div class=card><b>${esc(p.name)}</b> <small>${p.kind==='resource'?'Texture / resource pack':'Behavior pack'}${p.blocks&&p.blocks.length?', '+p.blocks.length+' blocks':''}${p.active?' · ACTIVE':''}</small><br><button onclick="A.togglePack('${p.id}')">${p.active?'Deactivate':'Activate'}</button><button onclick="A.movePack('${p.id}',-1)">↑</button><button onclick="A.movePack('${p.id}',1)">↓</button><button onclick="A.renamePack('${p.id}')">Rename</button>${p.kind==='resource'?`<button onclick="A.editPack('${p.id}')">Edit textures</button>`:`<button onclick="A.addBlock('${p.id}')">Add block</button>`}<button onclick="exportPack(packs.find(x=>x.id==='${p.id}'))">Export</button><button onclick="A.delPack('${p.id}')">Remove</button></div>`;
 return`<div class=card><label class=btn>Import .mcpack / .mcaddon / .zip<input type=file hidden multiple accept=".mcpack,.mcaddon,.zip,.mcworld" onchange="A.imp(this.files)"></label><button onclick="A.newPack('resource')">New texture pack</button><button onclick="A.newPack('behavior')">New behavior pack</button><br><small>Active packs stack: later ones in the list override earlier ones. Behavior-pack blocks appear in the creative inventory.</small></div>`+packs.slice().sort((a,b)=>a.order-b.order).map(row).join('')||'<small>No packs installed. Import one or open the Library.</small>'}
V.library=async()=>`<small>Offline add-on library: installed locally, nothing is downloaded.</small>`+LIB.map(l=>`<div class=card><b>${l.name}</b> <small>${l.kind==='resource'?'Texture pack':'Behavior pack'}</small><br>${l.desc}<br><button onclick="A.installLib('${l.id}')">${packs.some(p=>p.id===l.id)?'Reinstall':'Install'}</button></div>`).join('');
V.multi=async()=>`<div class=card><h3>Play together on the same Wi-Fi or hotspot</h3><small>No internet needed. Host and guest exchange two codes once (message them, or read them aloud / scan a photo). Each extra player repeats the steps.</small></div>
 <div class=card><b>Host</b> (start a world first)<br><button onclick="A.hostCode()">1. Create invite code</button><textarea id=hc readonly placeholder="Invite code appears here"></textarea><small>Send it to the guest, then paste their reply:</small><textarea id=ac placeholder="Guest reply code"></textarea><button onclick="A.accept()">2. Connect guest</button></div>
 <div class=card><b>Guest</b><br><textarea id=jc placeholder="Paste host invite code"></textarea><button onclick="A.joinCode()">Create reply code</button><textarea id=jc2 readonly placeholder="Reply code appears here — send it to the host"></textarea><button onclick="A.resume()">Back to game</button></div>`;
V.settings=async()=>{const r=(k,l,a,b,s)=>`<div><label>${l} <input type=range min=${a} max=${b} step=${s} value=${S[k]} oninput="A.set('${k}',this.value);this.nextElementSibling.textContent=this.value"><b>${S[k]}</b></label></div>`;
 return`<div class=card>${r('rd','Render distance (chunks)',2,10,1)}${r('fov','Field of view',55,110,1)}${r('sc','Render scale (lower = faster)',.5,1,.05)}${r('sens','Look sensitivity',.3,3,.1)}<label><input type=checkbox ${S.coords?'checked':''} onchange="A.set('coords',this.checked?1:0)"> Show coordinates</label><br><small>Lower render distance and render scale on older phones or TVs.</small></div>`};
/* ---------- boot ---------- */
(async()=>{if(!gl){$('#mbody').innerHTML='<div class=card>WebGL is not available on this device.</div>';return}
 try{packs=await dbAll('packs')}catch(e){}packs.sort((a,b)=>a.order-b.order);ax.imageSmoothingEnabled=false;await applyPacks();menu('play');
 if(!navigator.storage||!navigator.storage.persist)return;navigator.storage.persist()})();
</script></body></html>
